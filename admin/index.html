<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · 31 anos da Carol</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,800&display=swap">
  <link rel="stylesheet" href="../estilo/cores.css?v=2026112801">
  <link rel="stylesheet" href="../estilo/estilo.css?v=2026112801">
  <style>
    .admin-topo { background: var(--chocolate); color: var(--creme); }
    .admin-topo .container { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 68px; flex-wrap: wrap; }
    .admin-topo .marca span { color: var(--caramelo); }
    .admin-topo :focus-visible { outline-color: var(--creme); }
    .login { max-width: 440px; margin: 3rem auto; }
    .campo input[type="password"] {
      width: 100%; min-height: 50px; padding: .75rem 1.1rem;
      border: 2px solid var(--cafe); border-radius: 18px; background: #fff; color: var(--chocolate); font: inherit;
    }
    .resumo { display: grid; gap: .75rem; grid-template-columns: repeat(2, 1fr); margin: 1.5rem 0 2.5rem; }
    @media (min-width: 760px) { .resumo { grid-template-columns: repeat(4, 1fr); } }
    .resumo .card { padding: 1.25rem; }
    .resumo .card__valor { font-size: 2.2rem; margin: 0; }
    .barra-acoes { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between; margin: 2.5rem 0 1rem; }
    .barra-acoes h2 { margin: 0; font-size: 1.8rem; }
    .tabela-caixa { overflow-x: auto; background: var(--areia); border-radius: 22px; padding: .5rem; }
    table { width: 100%; border-collapse: collapse; min-width: 560px; }
    th, td { text-align: left; padding: .75rem .9rem; vertical-align: top; }
    th { font-size: .82rem; text-transform: uppercase; letter-spacing: .1em; }
    tbody tr { border-top: 1px solid rgba(121, 92, 72, .35); }
    .etiqueta { display: inline-block; border-radius: 999px; padding: .15rem .7rem; font-weight: 700; font-size: .88rem; white-space: nowrap; }
    .etiqueta--sim { background: var(--chocolate); color: var(--creme); }
    .etiqueta--nao { border: 2px solid var(--cafe); }
    .vazio { padding: 1rem .9rem; margin: 0; }
    .msg { font-weight: 700; margin: 1rem 0 0; }
    .msg:empty { margin: 0; }
  </style>
</head>
<body>
  <header class="admin-topo">
    <div class="container">
      <span class="marca"><span>31</span>anos da Carol&nbsp;· Admin</span>
      <button class="botao botao--contorno-claro botao--pequeno" type="button" id="sair" hidden>Sair</button>
    </div>
  </header>

  <main class="container" id="conteudo">
    <div id="aviso-demo"></div>

    <section class="login card" id="login" aria-labelledby="titulo-login">
      <h1 id="titulo-login" style="font-size:2rem">Área da Carol</h1>
      <p>Digite sua senha para ver as confirmações e os presentes escolhidos.</p>
      <form id="form-login">
        <div class="campo">
          <label for="senha">Senha</label>
          <input type="password" id="senha" autocomplete="current-password" required>
        </div>
        <button class="botao botao--chocolate" type="submit" style="width:100%">Entrar</button>
        <p class="msg" id="msg-login" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section id="painel" hidden aria-labelledby="titulo-painel" style="padding: 2.5rem 0 4rem">
      <div class="barra-acoes" style="margin-top:0">
        <h1 id="titulo-painel" style="margin:0;font-size:2.2rem">Painel da festa</h1>
        <button class="botao botao--contorno botao--pequeno" type="button" id="atualizar"></button>
      </div>
      <p class="msg" id="msg-painel" role="status" aria-live="polite"></p>

      <div class="resumo" id="resumo"></div>

      <div class="barra-acoes">
        <h2>Confirmações</h2>
        <button class="botao botao--caramelo botao--pequeno" type="button" id="csv-confirmacoes"></button>
      </div>
      <div class="tabela-caixa" id="tabela-confirmacoes"></div>

      <div class="barra-acoes">
        <h2>Presentes escolhidos</h2>
        <button class="botao botao--caramelo botao--pequeno" type="button" id="csv-presentes"></button>
      </div>
      <div class="tabela-caixa" id="tabela-presentes"></div>
    </section>
  </main>

  <script src="../conteudo/presentes.js?v=2026112801"></script>
  <script src="../conteudo/conexao.js?v=2026112801"></script>
  <script src="../js/icones.js?v=2026112801"></script>
  <script src="../js/servidor.js?v=2026112801"></script>
  <script src="../js/admin.js?v=2026112801"></script>
</body>
</html>
